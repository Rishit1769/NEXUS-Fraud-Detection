# NEXUS Fraud Detection deployment stack.
#
# NOTE: the MySQL database runs as the external `mysql-server` container
# (mysql:8.0) on host port 3306 — it holds the live data and is deliberately
# NOT managed here. The app connects to it via the DATABASE_URL in .env.
#
#   docker compose up -d --build
services:
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-fraud-detection:latest
    container_name: nexus-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      # Inside the compose network, Redis is reachable by service name.
      REDIS_URL: "redis://redis:6379"
      PORT: "3002"
      MODEL_API_URL: "http://model-api:8001"
      MODEL_API_SECRET: "${MODEL_API_SECRET:-}"
      MODEL_API_TIMEOUT_MS: "1500"
    depends_on:
      redis:
        condition: service_healthy
      model-api:
        condition: service_healthy
    healthcheck:
      # 200/401 from an authed probe means the server is up.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3002/api/auth/me').then(r=>process.exit(r.status===401||r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  model-api:
    build:
      context: .
      dockerfile: ml/Dockerfile
    image: nexus-model-api:latest
    container_name: nexus-model-api
    restart: unless-stopped
    environment:
      MODEL_API_SECRET: "${MODEL_API_SECRET:-}"
      REQUIRE_LLM_FEATURES: "${REQUIRE_LLM_FEATURES:-true}"
      MODEL_ARTIFACT_ROOT: "/app/ml/artifacts"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  nexus_redis_data:
